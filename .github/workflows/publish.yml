name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish stable v1.0.0
    if: github.event.release.tag_name == 'v1.0.0' && github.event.release.prerelease == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm-production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24.11.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install npm CLI with Trusted Publishing support
        run: npm install --global npm@11.15.0
      - name: Verify release tag and package version
        run: |
          node --input-type=module -e "import { readFileSync } from 'node:fs'; const pkg = JSON.parse(readFileSync('package.json', 'utf8')); if (pkg.version !== '1.0.0') throw new Error('Expected package version 1.0.0, got ' + pkg.version); if (process.env.GITHUB_REF !== 'refs/tags/v1.0.0') throw new Error('Unexpected release ref: ' + process.env.GITHUB_REF);"
      - run: npm ci
      - run: npm audit
      - run: npm run check
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: xvfb-run -a npm run test:integration
      - name: Publish with npm provenance
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
